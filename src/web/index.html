<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de consumo</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --ink: #1f1e1c; --muted: #77746d; --line: #e6e3dc;
    --accent: #d97757; --ok: #3f9d6b; --warn: #d9a441; --bad: #cf4f4f; --track: #ece9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18; --card: #252422; --ink: #f1efe9; --muted: #a09c93; --line: #35332f;
      --accent: #e08a6a; --ok: #58b88a; --warn: #e0b45a; --bad: #e06a6a; --track: #35332f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; max-width: 220px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .stamp { color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 5px; }
  .dot.live { background: var(--ok); }
  section.tool { margin-bottom: 26px; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .big { font-size: 26px; font-weight: 650; line-height: 1.15; }
  .note { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .meter { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .meter > i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
  .rows { margin-top: 6px; }
  .row { display: grid; grid-template-columns: 90px 1fr 36px; gap: 8px; align-items: center; margin: 4px 0; font-size: 12px; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meter { margin: 0; height: 6px; }
  .row .meter > i { background: var(--accent); }
  .row .n { text-align: right; color: var(--muted); }
  .wide { margin-top: 10px; }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin-top: 8px; }
  .chart .col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .chart .bar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .chart .lbl { font-size: 10px; color: var(--muted); margin-top: 3px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .err { background: var(--card); border: 1px solid var(--bad); color: var(--bad); padding: 10px 14px; border-radius: 10px; }
  .total { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tu panel de consumo</h1>
    <div class="controls">
      <select id="since" aria-label="Período">
        <option value="today">Hoy</option>
        <option value="24h">24 horas</option>
        <option value="7d" selected>7 días</option>
        <option value="30d">30 días</option>
        <option value="all">Todo</option>
      </select>
      <select id="project" aria-label="Proyecto"><option value="">Todos los proyectos</option></select>
      <button id="apply" type="button">Aplicar</button>
      <span class="stamp" id="stamp"></span>
    </div>
  </header>
  <div id="out"><div class="empty">Cargando…</div></div>
</main>
<script>
const $ = id => document.getElementById(id)
const out = $('out')
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

const usd = (v, complete = true) => v === null || v === undefined ? '—' : `${complete ? '' : '≥ '}$${v < 0.01 && v > 0 ? v.toFixed(4) : v.toFixed(2)}`
const tokens = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(1)}k` : String(n)
const dur = ms => {
  if (ms === null || ms === undefined) return '—'
  const m = Math.round(ms / 60000)
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min`
}
const RATE = { five_hour: 'Ventana de 5 horas', seven_day: 'Ventana de 7 días', thirty_day: 'Ventana de 30 días' }
const tone = p => p >= 85 ? 'var(--bad)' : p >= 60 ? 'var(--warn)' : 'var(--ok)'
const meter = (p, color) => `<div class="meter"><i style="width:${Math.max(0, Math.min(100, p))}%;background:${color ?? tone(p)}"></i></div>`

function card(title, big, note, extra = '') {
  return `<div class="card"><h3>${title}</h3><div class="big">${big}</div>${note ? `<div class="note">${note}</div>` : ''}${extra}</div>`
}

function toolsCard(calls, total) {
  const top = Object.entries(calls).sort((a, b) => b[1] - a[1]).slice(0, 5)
  const max = top[0]?.[1] || 1
  const rows = top.map(([k, n]) => `<div class="row"><span class="name" title="${esc(k)}">${esc(k)}</span>${meter(n / max * 100, 'var(--accent)')}<span class="n">${n}</span></div>`).join('')
  return card('Herramientas usadas', total, total ? '' : 'Sin llamadas', `<div class="rows">${rows}</div>`)
}

function chart(daily) {
  if (!daily.length) return ''
  const values = daily.map(d => d.costUsd ?? d.tokens)
  const byCost = daily.some(d => d.costUsd !== null)
  const max = Math.max(...values, 1)
  const cols = daily.slice(-14).map(d => {
    const v = d.costUsd ?? d.tokens
    const tip = `${d.day}: ${d.requests} peticiones, ${tokens(d.tokens)} tokens${d.costUsd !== null ? `, ${usd(d.costUsd)}` : ''}`
    return `<div class="col" title="${esc(tip)}"><div class="bar" style="height:${v / max * 100}%"></div><span class="lbl">${esc(d.day.slice(8))}</span></div>`
  }).join('')
  return `<div class="card wide"><h3>${byCost ? 'Coste' : 'Tokens'} por día</h3><div class="chart">${cols}</div></div>`
}

function renderTool(s) {
  const a = s.active, p = s.period
  const head = `<h2>${esc(s.label)}</h2>`
  if (!a) return `<section class="tool">${head}<div class="sub">Sin sesiones en este período.</div></section>`
  const ctx = a.context
  const where = a.cwd ? a.cwd.split(/[\\/]/).filter(Boolean).pop() : ''
  const sub = `<span class="dot ${a.isLive ? 'live' : ''}"></span>${a.isLive ? 'sesión activa' : 'última sesión'}${a.model ? ` · ${esc(a.model)}` : ''}${where ? ` · ${esc(where)}` : ''}`
  const cards = [
    card('Coste por petición', usd(a.lastRequestUsd), `promedio ${usd(a.averageRequestUsd)} · ${a.requests} peticiones`),
    card('Coste estimado', usd(a.costUsd, a.isCostComplete), 'de esta sesión'),
    ctx.percent === null
      ? card('Contexto disponible', '—', 'sin datos')
      : card('Contexto disponible', `${ctx.freePercent.toFixed(0)}%`, `${tokens(ctx.tokens)} de ${tokens(ctx.window)} usados`, meter(ctx.percent)),
    toolsCard(a.toolCalls, a.toolCallsTotal),
    card('Tiempo de sesión', dur(a.elapsedMs), 'tiempo de trabajo'),
  ]
  const limits = s.rateLimits.map(l => {
    const reset = l.resetsAt ? `se reinicia ${new Date(l.resetsAt).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' })}` : ''
    return card(RATE[l.kind] ?? l.kind, `${Math.round(l.percentUsed)}%`, reset, meter(l.percentUsed))
  })
  const t = p.tokens
  const period = `<div class="total">Período: ${p.sessions} sesiones · ${p.requests} peticiones · ${tokens(t.total)} tokens (entrada ${tokens(t.input)}, caché ${tokens(t.cacheRead + t.cacheWrite)}, salida ${tokens(t.output)}) · ${usd(p.costUsd, p.isCostComplete)}</div>`
  return `<section class="tool">${head}<div class="sub">${sub}</div><div class="grid">${cards.join('')}${limits.join('')}</div>${chart(p.daily)}<div class="wide">${period}</div></section>`
}

let projectsFilled = false
function fillProjects(list) {
  const sel = $('project'), keep = sel.value
  if (projectsFilled && sel.options.length > 1) return
  projectsFilled = true
  sel.innerHTML = '<option value="">Todos los proyectos</option>' + list.map(p => `<option value="${esc(p.path)}">${esc(p.name)} (${p.sessions})</option>`).join('')
  sel.value = keep
}

// Filtros aplicados: los selectores solo cambian al apretar "Aplicar".
let applied = { since: '7d', project: '' }
let seq = 0

async function refresh() {
  const mine = ++seq
  const q = new URLSearchParams({ since: applied.since })
  if (applied.project) q.set('project', applied.project)
  $('apply').disabled = true
  $('apply').textContent = 'Cargando…'
  try {
    const res = await fetch(`/api/summary?${q}`)
    const data = await res.json()
    if (mine !== seq) return // llegó una respuesta más nueva: esta se descarta
    if (!res.ok) throw new Error(data.error || res.statusText)
    fillProjects(data.projects)
    const live = data.summaries.some(s => s.active?.isLive)
    out.innerHTML = data.summaries.some(s => s.active || s.period.requests)
      ? data.summaries.map(renderTool).join('')
      : '<div class="empty">No se encontró actividad en este período.</div>'
    $('stamp').innerHTML = `<span class="dot ${live ? 'live' : ''}"></span>${esc(data.label)} · ${new Date(data.generatedAt).toLocaleTimeString('es-AR')}`
  } catch (e) {
    if (mine === seq) out.innerHTML = `<div class="err">No se pudo leer el consumo: ${esc(e.message)}</div>`
  } finally {
    if (mine === seq) { $('apply').disabled = false; $('apply').textContent = 'Aplicar' }
  }
}

$('apply').onclick = () => {
  applied = { since: $('since').value, project: $('project').value }
  refresh()
}
refresh()
setInterval(() => { if (!document.hidden && !$('apply').disabled) refresh() }, 15000)
</script>
</body>
</html>
